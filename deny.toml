# cargo-deny: advisories, license allowlist, source registries.
# Run: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Unmaintained transitives with no upgrade path in our graph. cargo audit
# already reports these as allowed warnings; list them explicitly so
# `cargo deny check advisories` agrees instead of failing the weekly run.
# Drop an entry as soon as its dependency chain allows a fixed version.
ignore = [
    # bincode 1.3.3 (qdrant-edge storage) and 2.0.1 (vaporetto via qdrant-edge).
    "RUSTSEC-2025-0141",
    # paste 1.0.15 via fastembed -> tokenizers / image (exr, rav1e).
    "RUSTSEC-2024-0436",
    # serde_cbor 0.11.2 via qdrant-edge.
    "RUSTSEC-2021-0127",
    # zstd 0.13.3 / zstd-safe 7.3.0 via include-flate-compress 0.3.4
    # (jieba-rs -> charabia -> qdrant-edge). include-flate-compress pins
    # zstd 0.13; the fixes ship in zstd 0.14.3 / zstd-safe 8.2.0. Mirrored
    # in .cargo/audit.toml so `cargo audit` agrees.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]

[licenses]
version = 2
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
