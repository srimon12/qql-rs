[workspace]
resolver = "2"
members = [
    "crates/qql-core",
    "crates/qql-conformance",
    "crates/qql-grammar-gen",
    "crates/qql-plan",
    "crates/qql-embed",
    "crates/qql-runtime",
    "crates/qql-cli",
    "crates/qql-edge",
    "crates/qql-wasm",
    "crates/pyqql",
    "crates/pyqql-edge",
    "crates/nqql",
    "crates/nqql-edge",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.95"
authors = ["Srimon Danguria <srimon12mckv@gmail.com>"]
license = "MIT"
repository = "https://github.com/srimon12/qql-rs"
homepage = "https://github.com/srimon12/qql-rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
