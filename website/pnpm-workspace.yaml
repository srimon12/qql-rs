packages:
  - "."
  - "packages/*"

# pnpm 11: allow native postinstalls for the toolchain
onlyBuiltDependencies:
  - esbuild
  - sharp

allowBuilds:
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true

# Security overrides for transitive Dependabot alerts (GHSA-2v37-7h3g-55p8,
# GHSA-xcpc-8h2w-3j85, GHSA-5p4m-2wfm-xmqj). Patched versions verified on npm.
overrides:
  nanoid: 3.3.18
  adm-zip: 0.6.0
  js-yaml: 4.3.1
  sharp: 0.35.4
