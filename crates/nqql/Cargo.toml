[package]
name = "nqql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Node.js bindings for the QQL parser and Qdrant runtime"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["rest", "grpc"]
rest = ["qql/rest"]
grpc = ["qql/grpc"]

[dependencies]
serde = { workspace = true }
qql-core = { workspace = true, features = ["serde", "json"] }
qql-plan = { workspace = true }
qql = { workspace = true, features = ["rest", "grpc"] }
nqql-common = { path = "../nqql-common" }
napi = { version = "3", features = ["napi8", "serde-json", "async"] }
napi-derive = "3"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
