[package]
name = "nqql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Node.js bindings for the QQL parser and Qdrant runtime"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["rest", "grpc"]
rest = ["qql/rest"]
grpc = ["qql/grpc"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
qql-core = { version = "0.1.1", path = "../qql-core", features = ["serde", "json"] }
qql-plan = { version = "0.1.1", path = "../qql-plan" }
qql = { version = "0.1.1", path = "../qql-runtime", default-features = false, features = ["rest", "grpc"] }
napi = { version = "2", features = ["napi8", "serde-json", "async"] }
napi-derive = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
