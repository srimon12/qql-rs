[package]
name = "qql-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Embedded QQL executor backed by qdrant-edge and optional local FastEmbed inference"
documentation = "https://docs.rs/qql-edge"
readme = "README.md"
keywords = ["qql", "qdrant", "vector-search", "embeddings", "edge"]
categories = ["database"]

[features]
default = ["fastembed-local"]
# Local ONNX embedding via fastembed-rs (no network needed for inference)
fastembed-local = ["fastembed"]
# HTTP-based embedding provider (OpenAI-compatible API).
# Enables qql/rest so HttpEmbedder (reqwest) is available.
http-embedding = ["qql/rest"]

[dependencies]
qql-core = { workspace = true, features = ["serde", "json", "std"] }
qql-plan = { workspace = true }
qql-embed = { workspace = true }
qql = { workspace = true }

fastembed = { version = "6", optional = true, default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
    "image-models",
] }
qdrant-edge = "0.8"

tokio = { workspace = true, features = ["rt", "sync"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
