[package]
name = "pyqql-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Python bindings for local QQL execution with qdrant-edge and FastEmbed"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["fastembed-local", "http-embedding"]
# Local ONNX embedding via fastembed-rs.
fastembed-local = ["qql-edge/fastembed-local"]
# HTTP-based embedding provider (OpenAI-compatible API).
http-embedding = ["qql-edge/http-embedding"]

[dependencies]
qql-core = { version = "0.2.2", path = "../qql-core", features = ["serde"] }
qql-plan = { version = "0.2.2", path = "../qql-plan" }
qql = { version = "0.2.2", path = "../qql-runtime", default-features = false }
qql-edge = { version = "0.2.2", path = "../qql-edge", default-features = false }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
pythonize = "0.23"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
