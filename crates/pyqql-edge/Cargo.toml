[package]
name = "pyqql-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Python bindings for local QQL execution with qdrant-edge and FastEmbed"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["fastembed-local", "http-embedding"]
# Local ONNX embedding via fastembed-rs.
fastembed-local = ["qql-edge/fastembed-local"]
# HTTP-based embedding provider (OpenAI-compatible API).
http-embedding = ["qql-edge/http-embedding"]

[dependencies]
qql-core = { workspace = true, features = ["serde", "json"] }
pyqql-common = { path = "../pyqql-common" }
qql-plan = { workspace = true }
qql = { workspace = true }
qql-edge = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310", "parking_lot"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
