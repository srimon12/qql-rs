[package]
name = "qql-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared dense and sparse embedding resolution for QQL runtimes"
documentation = "https://docs.rs/qql-embed"
readme = "README.md"
keywords = ["qql", "qdrant", "embeddings", "vector-search", "bm25"]
categories = ["database", "algorithms"]

[dependencies]
qql-core = { version = "0.3.0", path = "../qql-core", features = ["std"] }
async-trait = "0.1"
phf = { version = "0.14", features = ["macros"] }
# Wire-compatible BM25: same murmur3 + snowball crates the Qdrant server uses.
murmur3_32 = "0.1"
rust-stemmers = { package = "qdrant-rust-stemmers", version = "1.2" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
