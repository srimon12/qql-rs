[package]
name = "nqql-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Node.js bindings for local QQL execution with qdrant-edge and FastEmbed"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# http-embedding is default to match pyqql-edge: both `httpExecutor` and the
# standalone `execute({ embedUrl })` path are documented in the README and the
# website, so they must be present in default-feature builds.
default = ["fastembed-local", "http-embedding"]
# Local ONNX embedding via fastembed-rs (downloads models on first use — never shipped in npm package)
fastembed-local = ["qql-edge/fastembed-local"]
# HTTP-based embedding provider (OpenAI-compatible API)
http-embedding = ["qql-edge/http-embedding"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
qql-core = { version = "0.2.1", path = "../qql-core", features = ["serde", "json"] }
qql-plan = { version = "0.2.1", path = "../qql-plan" }
qql = { version = "0.2.1", path = "../qql-runtime", default-features = false }
qql-edge = { version = "0.2.1", path = "../qql-edge" }
napi = { version = "2", features = ["napi8", "serde-json", "async"] }
napi-derive = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
