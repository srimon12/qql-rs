[package]
name = "qql-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line interface, REPL, converter, and migration tools for QQL"
documentation = "https://docs.rs/qql-cli"
readme = "README.md"
keywords = ["qql", "qdrant", "cli", "vector-search", "query-language"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "qql"
path = "src/main.rs"

[features]
default = ["grpc", "rest"]
grpc = ["qql/grpc"]
rest = ["qql/rest"]
# Local in-process qdrant-edge backend (no Qdrant server needed).
# Opt-in because FastEmbed and ONNX materially increase compile time and
# the optimized CLI binary size.
edge = ["qql-edge", "qql-edge/http-embedding"]

[dependencies]
qql-core = { version = "0.2.0", path = "../qql-core" }
qql-plan = { version = "0.2.0", path = "../qql-plan" }
qql = { version = "0.2.0", path = "../qql-runtime", default-features = false }
qql-edge = { version = "0.2.0", path = "../qql-edge", optional = true }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyline = "14"
mimalloc = "0.1"
unicode-width = "0.2"
