[package]
name = "qql-record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Transparent Qdrant REST recorder proxy and live QQL converter"
documentation = "https://docs.rs/qql-record"
readme = "README.md"
keywords = ["qql", "qdrant", "recorder", "proxy", "converter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "qql-record"
path = "src/main.rs"

[dependencies]
qql-convert = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "fs", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
qql-core = { workspace = true, features = ["serde", "json", "std"] }

[lints]
workspace = true
