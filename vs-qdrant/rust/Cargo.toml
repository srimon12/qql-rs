[package]
name = "vs-qdrant-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone package (excluded from the qql workspace by the root manifest).
[workspace]

[dependencies]
# Official Qdrant Rust SDK (gRPC, tonic) — the reference client.
qdrant-client = "1.19"
# QQL runtime (gRPC backend for transport parity; path deps until 0.4.0 is
# published to crates.io — switch to `qql = "0.4"` after release).
qql = { path = "../../crates/qql-runtime" }
qql-core = { path = "../../crates/qql-core", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
debug = false
