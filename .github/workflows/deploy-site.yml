name: Deploy QQL Site

# qql.veristamp.in → Pages project `qql`
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/merge-qql-dist.mjs"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
    inputs:
      playground_ref:
        description: "qql-wasm-demo ref"
        default: "main"

env:
  NODE_VERSION: "24"
  CF_PAGES_PROJECT: qql
  PLAYGROUND_REPO: srimon12/qql-wasm-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Validate documentation and build website
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Checkout playground
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLAYGROUND_REPO }}
          ref: ${{ inputs.playground_ref || 'main' }}
          path: .playground-src

      - name: Build playground
        working-directory: .playground-src
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          VITE_BASE=/playground/ pnpm build
          mkdir -p ../.playground-dist
          cp -a dist/. ../.playground-dist/
          test -f ../.playground-dist/index.html

      - name: Merge
        run: node scripts/merge-qql-dist.mjs
        env:
          WEBSITE_DIST: website/dist
          PLAYGROUND_DIST: .playground-dist
          OUT_DIST: dist-site

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-site --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main
