name: Security

# Scheduled dependency audits (npm / pnpm / pip). CodeQL runs through the
# repository's default setup (Rust + Actions/JS/TS/Python); an advanced
# CodeQL job here cannot upload SARIF while default setup is enabled.
# Scheduled + dispatch only — dependency-audit jobs would otherwise block
# every PR on advisory mirror flakiness.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:20 UTC.
    - cron: "20 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  cargo-audit:
    name: cargo audit (crates.io advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit --file Cargo.lock

  cargo-deny:
    name: cargo deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  npm-audit:
    name: npm audit (nqql, nqql-edge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The packages are lockfile-less in CI (see ci.yml); build the lock
      # in-memory first — `npm audit` requires one.
      - name: nqql audit
        working-directory: crates/nqql
        run: |
          npm install --package-lock-only --omit=optional --no-audit --no-fund
          npm audit --omit=dev
      - name: nqql-edge audit
        working-directory: crates/nqql-edge
        run: |
          npm install --package-lock-only --omit=optional --no-audit --no-fund
          npm audit --omit=dev

  pnpm-audit:
    name: pnpm audit (website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: pnpm audit
        working-directory: website
        run: pnpm audit --prod
